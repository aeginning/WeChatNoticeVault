name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate tag and signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          VERSION_NAME="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION_NAME" || "$TAG_VERSION" != "$VERSION_NAME" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match app versionName ($VERSION_NAME)"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Decode signing keystore into runner temp storage
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/noticevault-release-signing.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run tests and build signed Release APK
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Verify APK signature and create checksums
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Release APK was not generated"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          SOURCE_ZIP="$RUNNER_TEMP/WeChatNoticeVault-$RELEASE_VERSION-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" "$GITHUB_REF_NAME"
          CHECKSUMS="$RUNNER_TEMP/WeChatNoticeVault-$RELEASE_VERSION-SHA256SUMS.txt"
          sha256sum "$APK_PATH" "$SOURCE_ZIP" > "$CHECKSUMS"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "source_path=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "checksums_path=$CHECKSUMS" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          WeChatNoticeVault $RELEASE_VERSION

          - Signed Android Release APK
          - Source archive
          - SHA-256 checksums
          - APK signature verified by apksigner
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.apk_path }}" \
            "${{ steps.package.outputs.source_path }}" \
            "${{ steps.package.outputs.checksums_path }}" \
            --title "WeChatNoticeVault $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
