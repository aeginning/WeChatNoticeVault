name: Android CI
on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Check release signing configuration
        id: release-signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release keystore
        if: steps.release-signing.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noticevault-release.jks"
          chmod 600 "$RUNNER_TEMP/noticevault-release.jks"
      - name: Build signed release APK
        if: steps.release-signing.outputs.available == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/noticevault-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed release APK
        if: steps.release-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WeChatNoticeVault-2.1.9-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Package source archive
        run: git archive --format=zip --output "$RUNNER_TEMP/WeChatNoticeVault-2.1.9-source.zip" HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: WeChatNoticeVault-2.1.9-source
          path: ${{ runner.temp }}/WeChatNoticeVault-2.1.9-source.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeChatNoticeVault-2.1.9-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Generate APK SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          checksum_file="$RUNNER_TEMP/WeChatNoticeVault-2.1.9-SHA256SUMS.txt"
          sha256sum app/build/outputs/apk/debug/*.apk > "$checksum_file"
          release_apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#release_apks[@]} > 0 )); then
            sha256sum "${release_apks[@]}" >> "$checksum_file"
          fi
      - name: Upload APK SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: WeChatNoticeVault-2.1.9-checksums
          path: ${{ runner.temp }}/WeChatNoticeVault-2.1.9-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
