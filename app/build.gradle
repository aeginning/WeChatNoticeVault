plugins { id 'com.android.application' }

def releaseStoreFile = System.getenv('RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')
def releaseSigningReady = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'com.aeginning.noticevault'
    compileSdk 35
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'com.aeginning.noticevault'
        minSdk 26
        targetSdk 35
        versionCode 219
        versionName '2.1.9'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}
