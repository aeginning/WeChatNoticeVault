plugins { id 'com.android.application' }

// Release signing material is supplied only by the environment or GitHub Actions Secrets.
def releaseStoreFilePath = System.getenv('RELEASE_STORE_FILE')
def releaseStorePasswordValue = System.getenv('RELEASE_STORE_PASSWORD')
def releaseKeyAliasValue = System.getenv('RELEASE_KEY_ALIAS')
def releaseKeyPasswordValue = System.getenv('RELEASE_KEY_PASSWORD')
def releaseSigningReady = [releaseStoreFilePath, releaseStorePasswordValue, releaseKeyAliasValue, releaseKeyPasswordValue].every { value ->
    value != null && !value.trim().isEmpty()
}
if (System.getenv('REQUIRE_RELEASE_SIGNING') == 'true' && !releaseSigningReady) {
    throw new GradleException('Release signing secrets are missing; refusing to build an unsigned release.')
}

android {
    namespace 'com.aeginning.noticevault'
    compileSdk 35
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'com.aeginning.noticevault'
        minSdk 26
        targetSdk 35
        versionCode 230
        versionName '2.3.0'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePasswordValue
                keyAlias releaseKeyAliasValue
                keyPassword releaseKeyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}
